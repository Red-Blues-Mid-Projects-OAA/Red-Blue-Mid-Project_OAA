name: Daily Pipeline 300

on:
  schedule:
    # 09:30 KST (UTC+9) = 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-pipeline-300
  cancel-in-progress: false

jobs:
  run-pipeline-300:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
      ORACLE_DSN: ${{ secrets.ORACLE_DSN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            pandas \
            scipy \
            scikit-learn \
            xgboost \
            optuna \
            matplotlib \
            yfinance \
            oracledb \
            python-dotenv \
            cvxpy

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for var in ORACLE_USER ORACLE_PASSWORD ORACLE_DSN; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: ${var}"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare shell script
        shell: bash
        run: |
          sed -i 's/\r$//' scripts/run_pipeline_300.sh
          chmod +x scripts/run_pipeline_300.sh

      - name: Run pipeline
        shell: bash
        run: |
          ./scripts/run_pipeline_300.sh
