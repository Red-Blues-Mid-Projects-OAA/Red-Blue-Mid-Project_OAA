name: Daily DB Load

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-db-load
  cancel-in-progress: false

jobs:
  update-stock-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
      ORACLE_DSN: ${{ secrets.ORACLE_DSN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance oracledb python-dotenv

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for var in ORACLE_USER ORACLE_PASSWORD ORACLE_DSN; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: ${var}"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Update stock data
        run: python -m DB.update_stock_data --mode auto
