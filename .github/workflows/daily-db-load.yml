name: Daily Pipeline 300

on:
  schedule:
    # Daily 10:00 KST (UTC+9) = 01:00 UTC
    - cron: "0 1 * * *"
  
  workflow_dispatch:

concurrency:
  group: daily-pipeline-300
  cancel-in-progress: false

jobs:
  run-pipeline-300:
    runs-on:
      - self-hosted
      - windows
      - x64
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      PYTHON_VERSION: "3.14.2"
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
      ORACLE_DSN: ${{ secrets.ORACLE_DSN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Allow PowerShell script execution on self-hosted runner
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force; Write-Host ('CurrentUser execution policy: ' + (Get-ExecutionPolicy -Scope CurrentUser))"

      - name: Verify runner Python version
        shell: powershell
        run: |
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            Write-Error "Python executable not found on self-hosted runner."
            exit 1
          }
          $expected = "${{ env.PYTHON_VERSION }}"
          $actual = python -c "import sys; print('.'.join(map(str, sys.version_info[:3])))"
          $pythonExe = python -c "import sys; print(sys.executable)"
          Write-Host "Python executable: $pythonExe"
          Write-Host "Python version on runner: $actual"
          if ($actual -ne $expected) {
            Write-Error "Python version mismatch on self-hosted runner. Expected $expected, got $actual."
            exit 1
          }

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall numpy pandas scipy scikit-learn xgboost optuna matplotlib yfinance oracledb python-dotenv cvxpy peewee

      - name: Validate required secrets
        shell: powershell
        run: |
          $missing = 0
          foreach ($var in @("ORACLE_USER", "ORACLE_PASSWORD", "ORACLE_DSN")) {
            if (-not [System.Environment]::GetEnvironmentVariable($var)) {
              Write-Host "Missing required secret: $var"
              $missing = 1
            }
          }
          if ($missing -ne 0) { exit 1 }

      - name: Run pipeline
        shell: powershell
        run: |
          $bash = "C:\Program Files\Git\bin\bash.exe"
          & $bash -c "sed -i 's/\r$//' scripts/run_pipeline_300.sh && chmod +x scripts/run_pipeline_300.sh && ./scripts/run_pipeline_300.sh"

      - name: Export backend demo snapshot
        shell: powershell
        run: |
          python -u -m DB.export_demo_snapshot --lookback-days 450

      - name: Commit generated JSON artifacts
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Classification/artifacts investment-mbti-back/data/demo_snapshot.json
          $hasChanges = git diff --cached --name-only
          if (-not $hasChanges) {
            Write-Host "No generated JSON changes to commit."
            exit 0
          }
          git commit -m "chore: refresh generated demo snapshot and artifacts"
          git push origin "HEAD:${{ github.ref_name }}"
